<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Master · MJC-19</title>
    <link rel="stylesheet" href="/static/css/quiz.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- ✅ MathJax Config — MUST be before the MathJax script -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true,
                processEnvironments: true,
                packages: { '[+]': ['ams', 'physics', 'cancel'] }
            },
            options: {
                enableMenu: false,
                ignoreHtmlClass: 'no-mathjax',
                processHtmlClass: 'mathjax'
            },
            svg: { fontCache: 'global' },
            loader: { load: ['[tex]/ams', '[tex]/physics', '[tex]/cancel'] }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" id="MathJax-script" async></script>
</head>
<body>

    <!-- Quiz HTML structure -->
    <div id="quiz-container">
        <div id="question-text" class="mathjax"></div>
        <div id="options-container"></div>
        <div id="feedback" class="feedback"></div>
        <!-- ... বাকি elements ... -->
    </div>

    <!-- ✅ Script load order — quiz.js আগে, gk.js পরে -->
    <script src="/static/js/quiz.js"></script>
    <script src="/static/js/gk.js"></script>
</body>
</html>
