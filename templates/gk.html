<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0f172a">
    <title>Quiz Master · MJC-19</title>

    <link rel="stylesheet" href="/static/css/quiz.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">

    <!-- MathJax Config -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true,
                processEnvironments: true,
                packages: { '[+]': ['ams', 'physics', 'cancel'] }
            },
            options: {
                enableMenu: false,
                ignoreHtmlClass: 'no-mathjax',
                processHtmlClass: 'mathjax'
            },
            svg: { fontCache: 'global' },
            loader: { load: ['[tex]/ams', '[tex]/physics', '[tex]/cancel'] }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" id="MathJax-script"></script>

    <!-- Fullscreen Button Styles -->
    <style>
        /* ---------- Fullscreen Button ---------- */
        .fullscreen-btn {
            position: fixed;
            top: 14px;
            right: 14px;
            z-index: 9999;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4361ee, #7209b7);
            color: #fff;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            box-shadow: 0 6px 20px rgba(67, 97, 238, 0.45);
            transition: all 0.25s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .fullscreen-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 8px 26px rgba(67, 97, 238, 0.65);
        }

        .fullscreen-btn:active {
            transform: scale(0.94);
        }

        .fullscreen-btn i {
            pointer-events: none;
        }

        /* Hide button in fullscreen mode? No — keep it visible to allow exit */
        .fullscreen-btn.is-fullscreen {
            background: linear-gradient(135deg, #f72585, #7209b7);
        }

        @media (max-width: 480px) {
            .fullscreen-btn {
                top: 10px;
                right: 10px;
                width: 40px;
                height: 40px;
                font-size: 1rem;
            }
        }

        /* ---------- Fullscreen Mode Enhancements ---------- */
        body:fullscreen,
        body:-webkit-full-screen,
        body:-moz-full-screen,
        body:-ms-fullscreen {
            background: #0f172a;
            overflow-y: auto;
        }

        /* Center content when in fullscreen on large screens */
        body:fullscreen .container {
            max-width: 760px;
            margin: 0 auto;
            padding-top: 10px;
        }
    </style>
</head>
<body>

<!-- ============================================= -->
<!-- FULLSCREEN BUTTON                             -->
<!-- ============================================= -->
<button id="fullscreen-btn" class="fullscreen-btn" title="Toggle Fullscreen" aria-label="Toggle Fullscreen">
    <i class="fas fa-expand" id="fullscreen-icon"></i>
</button>

<div class="container">
    <header>
        <h1><i class="fas fa-brain"></i>◆ 𝑸𝒖𝒊𝒛 𝒘𝒊𝒕𝒉 𝑹𝒆𝒛𝒖 ◆</h1>
        <p class="subtitle">MJC-19 · Advanced Classical Electrodynamics</p>
    </header>

    <div class="quiz-info-bar">
        <div class="info-item">
            <i class="fas fa-list-ol"></i>
            <span>Question: <strong id="current-question">1/25</strong></span>
        </div>
        <div class="info-item">
            <i class="fas fa-star"></i>
            <span>Score: <strong id="score">0</strong></span>
        </div>
        <div class="info-item">
            <i class="fas fa-hourglass-half"></i>
            <span>Total Time: <strong id="total-time">25:00</strong></span>
        </div>
    </div>

    <div class="timer-container">
        <div class="timer-bar">
            <span id="timer" class="timer"><i class="fas fa-clock"></i> 60s</span>
            <div class="progress-track">
                <div id="progress-fill" class="progress-fill" style="width: 4%;"></div>
            </div>
        </div>
    </div>

    <div class="question-container">
        <div id="question-text" class="question-text mathjax">Loading question...</div>
        <div id="options-container" class="options-container"></div>
        <div id="feedback" class="feedback"></div>
    </div>

    <div id="result-container" class="result-container" style="display: none;">
        <div class="result-card">
            <h2><i class="fas fa-trophy"></i> Quiz Completed!</h2>
            <div class="final-score-box">
                <span class="final-score" id="final-score">0/25</span>
                <span class="percentage" id="percentage">0%</span>
            </div>
            <p id="result-message" class="result-message">Keep learning!</p>

            <div class="stats-grid">
                <div class="stat-item correct-stat">
                    <i class="fas fa-check-circle"></i>
                    <span class="stat-value" id="correct-count">0</span>
                    <span class="stat-label">Correct</span>
                </div>
                <div class="stat-item incorrect-stat">
                    <i class="fas fa-times-circle"></i>
                    <span class="stat-value" id="incorrect-count">0</span>
                    <span class="stat-label">Incorrect</span>
                </div>
                <div class="stat-item time-stat">
                    <i class="fas fa-clock"></i>
                    <span class="stat-value" id="time-taken">00:00</span>
                    <span class="stat-label">Time Taken</span>
                </div>
            </div>

            <div class="result-buttons">
                <button id="restart-btn" class="btn btn-primary">
                    <i class="fas fa-redo"></i> Restart Quiz
                </button>
                <button id="home-btn" class="btn btn-secondary">
                    <i class="fas fa-home"></i> Home
                </button>
            </div>
        </div>
    </div>

    <footer>
        <p>Quiz Master Challenge &copy; 2026 | Designed with <i class="fas fa-heart"></i> for knowledge seekers</p>
         
    </footer>
</div>

<!-- ============================================= -->
<!-- FULLSCREEN LOGIC                              -->
<!-- ============================================= -->
<script>
    (function () {
        'use strict';

        const btn = document.getElementById('fullscreen-btn');
        const icon = document.getElementById('fullscreen-icon');
        if (!btn || !icon) return;

        // Cross-browser request
        function requestFullscreen(el) {
            if (el.requestFullscreen) return el.requestFullscreen();
            if (el.webkitRequestFullscreen) return el.webkitRequestFullscreen();
            if (el.mozRequestFullScreen) return el.mozRequestFullScreen();
            if (el.msRequestFullscreen) return el.msRequestFullscreen();
        }

        function exitFullscreen() {
            if (document.exitFullscreen) return document.exitFullscreen();
            if (document.webkitExitFullscreen) return document.webkitExitFullscreen();
            if (document.mozCancelFullScreen) return document.mozCancelFullScreen();
            if (document.msExitFullscreen) return document.msExitFullscreen();
        }

        function isFullscreen() {
            return !!(
                document.fullscreenElement ||
                document.webkitFullscreenElement ||
                document.mozFullScreenElement ||
                document.msFullscreenElement
            );
        }

        function updateButton() {
            if (isFullscreen()) {
                icon.classList.remove('fa-expand');
                icon.classList.add('fa-compress');
                btn.classList.add('is-fullscreen');
                btn.setAttribute('title', 'Exit Fullscreen');
            } else {
                icon.classList.remove('fa-compress');
                icon.classList.add('fa-expand');
                btn.classList.remove('is-fullscreen');
                btn.setAttribute('title', 'Enter Fullscreen');
            }
        }

        btn.addEventListener('click', function (e) {
            e.preventDefault();
            e.stopPropagation();

            if (isFullscreen()) {
                exitFullscreen();
            } else {
                // Fullscreen the entire page (body)
                requestFullscreen(document.documentElement);
            }
        });

        // Listen to fullscreen change events (all vendor prefixes)
        ['fullscreenchange', 'webkitfullscreenchange',
         'mozfullscreenchange', 'MSFullscreenChange'].forEach(function (evt) {
            document.addEventListener(evt, updateButton);
        });

        // Optional: auto-hide button while fullscreen on small screens after inactivity?
        // Not necessary. Keep simple.

        // Initial state
        updateButton();
    })();
</script>

<!-- Scripts -->
<script src="/static/js/quiz.js"></script>
<script src="/static/js/gk.js"></script>

</body>
</html>
